name: michat
description: Modern real-time chat application built with Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.3.0
  flutter_riverpod: ^2.3.0

  # API & Network
  dio: ^5.1.0
  socket_io_client: ^2.0.0
  http: ^1.1.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.1.0
  get_storage: ^2.1.1

  # Authentication
  firebase_auth: ^4.6.0
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0

  # Push Notifications
  firebase_messaging: ^14.6.0
  # 15.x derlenmiyor (Android 14 BigPictureStyle.bigLargeIcon belirsiz).
  # 16.x+ ile duzeldi; Dart tarafinda bu paket henuz kullanilmiyor.
  flutter_local_notifications: ^17.0.0

  # UI Components
  flutter_markdown: ^0.6.10
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.3.0

  # Date & Time
  intl: ^0.18.1
  timeago: ^3.5.0

  # Utilities
  uuid: ^3.0.7
  logger: ^2.0.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.4.0
  video_player: ^2.7.0
  camera: ^0.10.5

  # Firebase
  firebase_core: ^2.13.0
  firebase_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
